name: Docker image build

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true
jobs:
  build-linux-amd64:
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build-linux-amd64
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ttl.sh/kairos:${{ github.sha }}-amd64
  build-linux-arm64:
    runs-on: 'ubuntu-24.04-arm'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build-linux-amr64
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ttl.sh/kairos:${{ github.sha }}-arm64
  build:
    if: github.event_name == 'push'
    needs:
      - build-linux-amd64
      - build-linux-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: quay.io/kairos/kairos-init
      - uses: int128/docker-manifest-create-action@v2
        id: build
        with:
          index-annotations: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          sources: |
            ttl.sh/kairos:${{ github.sha }}-arm64
            ttl.sh/kairos:${{ github.sha }}-amd64
  # Preview image for PRs: consumers (e.g. kairos-io/kairos) can point their
  # Dockerfile at ghcr.io/kairos-io/kairos-init:pr-<N> while iterating.
  publish-pr:
    if: github.event_name == 'pull_request'
    needs:
      - build-linux-amd64
      - build-linux-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: int128/docker-manifest-create-action@v2
        with:
          tags: ghcr.io/${{ github.repository_owner }}/kairos-init:pr-${{ github.event.pull_request.number }}
          sources: |
            ttl.sh/kairos:${{ github.sha }}-arm64
            ttl.sh/kairos:${{ github.sha }}-amd64
