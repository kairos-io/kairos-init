name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux-amd64:
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=quay.io/kairos/kairos-init,push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  build-linux-arm64:
    runs-on: 'ubuntu-24.04-arm'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=quay.io/kairos/kairos-init,push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-arm64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  build-linux-riscv64:
    # No native riscv64 runner available; build stage cross-compiles natively via
    # --platform=$BUILDPLATFORM in the Dockerfile so QEMU is only needed for
    # platform registration, not for actual execution.
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/riscv64
          build-args: |
            SKIP_UPX=1
          outputs: type=image,name=quay.io/kairos/kairos-init,push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-riscv64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  build:
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-linux-riscv64
    runs-on: ubuntu-24.04
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: quay.io/kairos/kairos-init
      # The annotations keep what int128/docker-manifest-create-action used to
      # apply through index-annotations. A label value can contain spaces, so
      # they go through an array rather than word splitting.
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t annotations < <(
            jq -r '.labels | to_entries[] | "--annotation", "index:" + .key + "=" + .value' \
              <<< "$DOCKER_METADATA_OUTPUT_JSON"
          )
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create \
            "${annotations[@]}" "${tags[@]}" \
            $(printf 'quay.io/kairos/kairos-init@sha256:%s ' *)
      - name: Check the manifest list
        run: |
          docker buildx imagetools inspect \
            "$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
